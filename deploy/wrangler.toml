# Overwrite-deploy of the songreply app onto a spare worker slot.
# Deploy: npx wrangler deploy --config deploy/wrangler.toml
# Static assets only: no Durable Objects, no KV, no API endpoints.
name = "test-review"
main = "worker.js"
compatibility_date = "2026-09-29"

routes = [
  { pattern = "songreply.borken.app", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
